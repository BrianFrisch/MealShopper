version: '3.8'

services:
  # Locations Data Layer (PostgreSQL with Spatial Geospatial Extensions)
  locations-db:
    image: postgis/postgis:15-3.3
    container_name: mealshopper-locations-db
    environment:
      POSTGRES_USER: mealshopper_admin
      POSTGRES_PASSWORD: SecretLocationsPassword123!
      POSTGRES_DB: mealshopper_locations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G

  # Flyers and Scraped Deals Store (Document DB Layer)
  deals-store:
    image: mongo:6.0
    container_name: mealshopper-deals-store
    environment:
      MONGO_INITDB_ROOT_USERNAME: mealshopper_admin
      MONGO_INITDB_ROOT_PASSWORD: SecretDealsPassword123!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G

  # High-Speed Semantic/Exact-Match Planner Cache Matrix
  planner-cache:
    image: redis:7.0-alpine
    container_name: mealshopper-planner-cache
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  mongo_data: