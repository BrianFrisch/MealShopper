networks:
  mealshopper-net:
    driver: bridge

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: mealshopper-postgres
    environment:
      POSTGRES_DB: mealshopper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      SHOPPER_DB_PASSWORD: "${SHOPPER_DB_PASSWORD:?Set SHOPPER_DB_PASSWORD in .env}"
      USERS_DB_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
      PLANNER_DB_PASSWORD: "${PLANNER_DB_PASSWORD:?Set PLANNER_DB_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./apps/planning-domain/Infrastructure/postgres/init:/planner-postgres-init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # -d mealshopper
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - mealshopper-net

  # planner-db-init:
  #   image: postgres:16-alpine
  #   environment:
  #     PGPASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
  #     PLANNER_DB_PASSWORD: "${PLANNER_DB_PASSWORD:?Set PLANNER_DB_PASSWORD in .env}"
  #   volumes:
  #     - ./infra/postgres/init/10_create_planner_database.sql:/db-init/10_create_planner_database.sql:ro
  #     - ./infra/postgres/init/20_init_planner_schema.sql:/db-init/20_init_planner_schema.sql:ro
  #     - ./apps/planning-domain/Infrastructure/postgres/init:/planner-postgres-init:ro
  #   entrypoint: ["/bin/sh", "-c"]
  #   command: >-
  #     until pg_isready -h postgres -U postgres; do sleep 1; done;
  #     psql -v ON_ERROR_STOP=1 -h postgres -U postgres -f /db-init/10_create_planner_database.sql &&
  #     psql -v ON_ERROR_STOP=1 -h postgres -U postgres -f /db-init/20_init_planner_schema.sql
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - mealshopper-net

  redis:
    image: redis:7-alpine
    container_name: mealshopper-redis
    ports:
      - "6379:6379"
    networks:
      - mealshopper-net

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/MealShopper.Users/Dockerfile
    container_name: mealshopper-users
    environment:
      ASPNETCORE_URLS: "http://+:5125"
      ASPNETCORE_ENVIRONMENT: "Development"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealshopper_users
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}"
    ports:
      - "5125:5125"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mealshopper-net

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/MealShopper.Identity/Dockerfile
    container_name: mealshopper-identity
    environment:
      ASPNETCORE_URLS: "http://+:5119"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Redis: "redis:6379"
      UserService__BaseUrl: "http://user-service:5125"
    ports:
      - "5119:5119"
    depends_on:
      - redis
      - user-service
    networks:
      - mealshopper-net

  gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/MealShopper.Gateway/Dockerfile
    container_name: mealshopper-gateway
    environment:
      ReverseProxy__Clusters__orchestratorCluster__Destinations__destination1__Address: "http://orchestrator:5186"
      ReverseProxy__Clusters__identityCluster__Destinations__destination1__Address: "http://identity-service:5119"
      ReverseProxy__Clusters__shopperCluster__Destinations__destination1__Address: "http://shopper-domain:8001"
    ports:
      - "5247:5247"
    depends_on:
      - identity-service
      - orchestrator
      - shopper-domain
    networks:
      - mealshopper-net

  shopper-domain:
    build:
      context: ./apps/shopper-domain
      dockerfile: Dockerfile
    container_name: mealshopper-shopper-domain
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - REDIS_URL=redis://redis:6379
      - DEAL_DATA_DIR=/app/data/deals
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=gemini-3.5-flash-lite
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealshopper_shopper
      - POSTGRES_USER=shopper_app
      - POSTGRES_PASSWORD=${SHOPPER_DB_PASSWORD:?Set SHOPPER_DB_PASSWORD in .env}
    ports:
      - "8001:8001"
    volumes:
      - ./apps/shopper-domain/data/deals:/app/data/deals
      - ./apps/shopper-domain/Infrastructure/postgres:/app/Infrastructure/postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mealshopper-net

  planning-domain:
    build:
      context: ./apps/planning-domain
      dockerfile: Dockerfile
    container_name: mealshopper-planning-domain
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      PLANNER_USE_MOCK: "${PLANNER_USE_MOCK:-false}"
      GEMINI_MODEL_NAME: "${GEMINI_MODEL_NAME:-gemini-3.8-flash}"
      PLANNER_DB_HOST: postgres
      PLANNER_DB_PORT: "5432"
      PLANNER_DB_NAME: mealshopper_planner
      PLANNER_DB_USER: planner_app
      PLANNER_DB_PASSWORD: "${PLANNER_DB_PASSWORD:?Set PLANNER_DB_PASSWORD in .env}"
    ports:
      - "8002:8002"
    volumes:
      - ./apps/planning-domain/Infrastructure/postgres/init:/app/Infrastructure/postgres/init:ro
    depends_on:
      postgres:
        condition: service_healthy
      # planner-db-init:
      #   condition: service_completed_successfully
    networks:
      - mealshopper-net

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/MealShopper.Orchestrator/Dockerfile
    container_name: mealshopper-orchestrator
    environment:
      ASPNETCORE_URLS: "http://+:5277"
      ASPNETCORE_ENVIRONMENT: "Development"
      Identity__TokenEndpoint: "http://identity-service:5119/v1/auth/token"
      ShopperService__BaseUrl: "http://shopper-domain:8001"
      PlanningService__BaseUrl: "http://planning-domain:8002"
      ConnectionStrings__Redis: "redis:6379"
      Redis__InstanceName: "mealshopper:jobs:"
    ports:
      - "5277:5277"
    depends_on:
      - shopper-domain
      - planning-domain
      - identity-service
      - redis
    networks:
      - mealshopper-net

volumes:
  pgdata: