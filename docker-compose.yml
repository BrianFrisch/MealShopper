networks:
  mealshopper-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealshopper-postgres
    environment:
      POSTGRES_DB: mealshopper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .apps/user-service/MealShopper.Users/Infrastructure/postgres/00_run_all.sh:/docker-entrypoint-initdb.d/00_run_all.sh
      - .apps/user-service/MealShopper.Users/Infrastructure/postgres/init:/docker-entrypoint-initdb.d/init
      # - ./apps/user-service/MealShopper.Users/Data/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mealshopper"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - mealshopper-net

  redis:
    image: redis:7-alpine
    container_name: mealshopper-redis
    ports:
      - "6379:6379"
    networks:
      - mealshopper-net

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/MealShopper.Users/Dockerfile
    container_name: mealshopper-users
    environment:
      ASPNETCORE_URLS: "http://+:5125"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mealshopper;Username=mealshopper_app;Password=MealShopperApp_Dev_Pwd99!;"
    ports:
      - "5125:5125"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mealshopper-net

  identity-service:
    build:
      context: ./apps/identity-service/MealShopper.Identity
      dockerfile: Dockerfile
    container_name: mealshopper-identity
    environment:
      ASPNETCORE_URLS: "http://+:5119"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Redis: "redis:6379"
      UserService__BaseUrl: "http://user-service:5125"
    ports:
      - "5119:5119"
    depends_on:
      - redis
      - user-service
    networks:
      - mealshopper-net

  gateway:
    build:
      context: ./apps/api-gateway/MealShopper.Gateway
      dockerfile: Dockerfile
    container_name: mealshopper-gateway
    environment:
      ReverseProxy__Clusters__orchestratorCluster__Destinations__destination1__Address: "http://orchestrator:5186"
      ReverseProxy__Clusters__identityCluster__Destinations__destination1__Address: "http://identity-service:5119"
    ports:
      - "5247:5247"
    depends_on:
      - identity-service
    networks:
      - mealshopper-net

  shopper-domain:
    build:
      context: ./apps/shopper-domain
      dockerfile: Dockerfile
    container_name: mealshopper-shopper-domain
    ports:
      - "8001:8001"
    networks:
      - mealshopper-net

  planning-domain:
    build:
      context: ./apps/planning-domain
      dockerfile: Dockerfile
    container_name: mealshopper-planning-domain
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PLANNER_USE_MOCK: "${PLANNER_USE_MOCK:-false}"
      GEMINI_MODEL_NAME: "${GEMINI_MODEL_NAME:-gemini-3.8-flash}"
    ports:
      - "8002:8002"
    networks:
      - mealshopper-net

  orchestrator:
    build:
      context: ./apps/orchestrator/MealShopper.Orchestrator
      dockerfile: Dockerfile
    container_name: mealshopper-orchestrator
    environment:
      ASPNETCORE_URLS: "http://+:5277"
      ASPNETCORE_ENVIRONMENT: "Development"
      Identity__TokenEndpoint: "http://identity-service:5119/v1/auth/token"
      ShopperService__BaseUrl: "http://shopper-domain:8001"
      PlanningService__BaseUrl: "http://planning-domain:8002"
      ConnectionStrings__Redis: "redis:6379"
      Redis__InstanceName: "mealshopper:jobs:"
    ports:
      - "5277:5277"
    depends_on:
      - shopper-domain
      - planning-domain
      - identity-service
      - redis
    networks:
      - mealshopper-net

volumes:
  pgdata: